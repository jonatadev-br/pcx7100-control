name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (use pre-installed)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls -la $ANDROID_HOME

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install required SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build Debug APK
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug --no-daemon --stacktrace
          gradle-version: 8.5
          cache-disabled: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCX7100-Control-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: PCX7100 Control v${{ github.run_number }}
          body: |
            Build automático #${{ github.run_number }}
            
            **Funcionalidades:**
            - Controle de volume (slider)
            - Play/Pause/Próximo/Anterior
            - Equalizador 7 bandas animado
            - 5 Presets: Flat, Bass, Pop, Rock, Jazz
            - Conexão Bluetooth com PCX7100
            - Indicador de bateria
            - Controle de luzes LED
            - Tema Dark Neon (ciano #00FFC8)
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}